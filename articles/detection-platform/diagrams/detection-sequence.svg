<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- title -->
  <text x="40" y="44" font-size="22" font-weight="700" fill="#0f172a">One attack chain, two events, out of order</text>
  <text x="40" y="70" font-size="14.5" fill="#475569">Event A happens first but arrives late. Event B happens second but arrives first. Which time you trust decides whether the detection fires.</text>

  <!-- legend chips -->
  <g font-size="12.5">
    <rect x="40" y="90" width="214" height="26" rx="13" fill="#eff6ff" stroke="#3b82f6"/>
    <circle cx="60" cy="103" r="6" fill="#3b82f6"/><text x="74" y="107" fill="#1e3a8a">Event A (happened t=0)</text>
    <rect x="270" y="90" width="214" height="26" rx="13" fill="#fef3c7" stroke="#f59e0b"/>
    <circle cx="290" cy="103" r="6" fill="#f59e0b"/><text x="304" y="107" fill="#92400e">Event B (happened t=1)</text>
  </g>

  <!-- LANE 1: ingest time -->
  <text x="40" y="168" font-size="15" font-weight="700" fill="#334155">As they arrive  ·  ingest time</text>
  <line x1="40" y1="200" x2="1030" y2="200" stroke="#cbd5e1" stroke-width="2"/>
  <g font-size="11.5" fill="#64748b" text-anchor="middle">
    <line x1="120" y1="194" x2="120" y2="206" stroke="#94a3b8"/><text x="120" y="226">t=2</text>
    <line x1="420" y1="194" x2="420" y2="206" stroke="#94a3b8"/><text x="420" y="226">t=3</text>
    <line x1="820" y1="194" x2="820" y2="206" stroke="#94a3b8"/><text x="820" y="226">t=5</text>
  </g>
  <!-- B arrives first at t=2 -->
  <circle cx="120" cy="200" r="11" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/><text x="120" y="204" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <!-- window closes t=3 (ingest-time naive) -->
  <line x1="420" y1="176" x2="420" y2="248" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="420" y="266" font-size="11.5" fill="#dc2626" text-anchor="middle">naive window closes</text>
  <!-- A arrives late t=5 -->
  <circle cx="820" cy="200" r="11" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/><text x="820" y="204" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="820" y="178" font-size="11.5" fill="#1e3a8a" text-anchor="middle">A arrives too late</text>

  <!-- verdict 1 -->
  <rect x="1050" y="176" width="110" height="78" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="1105" y="206" font-size="13" font-weight="700" fill="#991b1b" text-anchor="middle">MISSED</text>
  <text x="1105" y="226" font-size="10.5" fill="#b91c1c" text-anchor="middle">window closed</text>
  <text x="1105" y="240" font-size="10.5" fill="#b91c1c" text-anchor="middle">before A landed</text>

  <!-- divider -->
  <line x1="40" y1="310" x2="1160" y2="310" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- LANE 2: event time -->
  <text x="40" y="360" font-size="15" font-weight="700" fill="#334155">As the pipeline reasons  ·  event time + watermark</text>
  <line x1="40" y1="396" x2="1030" y2="396" stroke="#cbd5e1" stroke-width="2"/>
  <g font-size="11.5" fill="#64748b" text-anchor="middle">
    <line x1="120" y1="390" x2="120" y2="402" stroke="#94a3b8"/><text x="120" y="422">t=0</text>
    <line x1="300" y1="390" x2="300" y2="402" stroke="#94a3b8"/><text x="300" y="422">t=1</text>
  </g>
  <!-- A reordered to t=0 -->
  <circle cx="120" cy="396" r="11" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/><text x="120" y="400" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="120" y="374" font-size="11.5" fill="#1e3a8a" text-anchor="middle">reordered to event time</text>
  <!-- B at t=1 -->
  <circle cx="300" cy="396" r="11" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/><text x="300" y="400" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <!-- watermark holds window -->
  <rect x="98" y="438" width="820" height="40" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="508" y="463" font-size="12.5" fill="#065f46" text-anchor="middle">correlation window, held open by the watermark for late arrivals</text>
  <line x1="120" y1="407" x2="120" y2="438" stroke="#10b981" stroke-width="1.4"/>
  <line x1="300" y1="407" x2="300" y2="438" stroke="#10b981" stroke-width="1.4"/>

  <!-- pattern assembled arrow to detection -->
  <line x1="918" y1="458" x2="1044" y2="458" stroke="#334155" stroke-width="1.8" marker-end="url(#s)"/>

  <!-- verdict 2 -->
  <rect x="1050" y="420" width="110" height="78" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="1105" y="450" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">DETECTED</text>
  <text x="1105" y="470" font-size="10.5" fill="#059669" text-anchor="middle">A and B ordered</text>
  <text x="1105" y="484" font-size="10.5" fill="#059669" text-anchor="middle">pattern assembled</text>

  <!-- bottom banner -->
  <rect x="40" y="540" width="1120" height="64" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="600" y="568" font-size="14" font-weight="700" fill="#0f172a" text-anchor="middle">The rule was identical in both lanes.</text>
  <text x="600" y="590" font-size="13.5" fill="#475569" text-anchor="middle">The difference was the pipeline: ingest-time ordering silently dropped the detection; event-time ordering with a watermark caught it.</text>
</svg>
