<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>

  <!-- title -->
  <text x="40" y="44" font-size="22" font-weight="700" fill="#0f172a">The Detection Data Platform</text>
  <text x="40" y="70" font-size="14.5" fill="#475569">A real-time, stateful streaming system, not a log store with rules on top. Each stage hides a distributed-systems decision.</text>

  <!-- Sources -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="40" y="150" width="150" height="150" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="115" y="172" font-size="13" font-weight="700" fill="#334155">Sources</text>
    <rect x="56" y="186" width="118" height="24" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="115" y="202" fill="#475569">Endpoint agents</text>
    <rect x="56" y="214" width="118" height="24" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="115" y="230" fill="#475569">Cloud audit logs</text>
    <rect x="56" y="242" width="118" height="24" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="115" y="258" fill="#475569">Network sensors</text>
    <rect x="56" y="270" width="118" height="24" rx="5" fill="#ffffff" stroke="#cbd5e1"/><text x="115" y="286" fill="#475569">Identity / app logs</text>
  </g>

  <!-- stage boxes -->
  <g text-anchor="middle">
    <!-- Collect -->
    <rect x="218" y="170" width="176" height="110" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
    <text x="306" y="206" font-size="16" font-weight="700" fill="#1e3a8a">Collect</text>
    <text x="306" y="230" font-size="12.5" fill="#1d4ed8">delivery semantics</text>
    <text x="306" y="250" font-size="11.5" fill="#475569">durable buffer, replay,</text>
    <text x="306" y="266" font-size="11.5" fill="#475569">at-least-once vs exactly-once</text>

    <!-- Normalize -->
    <rect x="414" y="170" width="176" height="110" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.8"/>
    <text x="502" y="206" font-size="16" font-weight="700" fill="#3730a3">Normalize</text>
    <text x="502" y="230" font-size="12.5" fill="#4f46e5">event-time, schema</text>
    <text x="502" y="250" font-size="11.5" fill="#475569">common schema,</text>
    <text x="502" y="266" font-size="11.5" fill="#475569">event-time stamping, watermarks</text>

    <!-- Enrich -->
    <rect x="610" y="170" width="176" height="110" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.8"/>
    <text x="698" y="206" font-size="16" font-weight="700" fill="#5b21b6">Enrich</text>
    <text x="698" y="230" font-size="12.5" fill="#7c3aed">stateful joins</text>
    <text x="698" y="250" font-size="11.5" fill="#475569">identity, asset inventory,</text>
    <text x="698" y="266" font-size="11.5" fill="#475569">threat intel</text>

    <!-- Correlate -->
    <rect x="806" y="170" width="176" height="110" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="894" y="206" font-size="16" font-weight="700" fill="#92400e">Correlate</text>
    <text x="894" y="230" font-size="11" fill="#b45309">partitioned stateful processing</text>
    <text x="894" y="250" font-size="11.5" fill="#78350f">windowed multi-stream joins,</text>
    <text x="894" y="266" font-size="11.5" fill="#78350f">checkpointed state</text>

    <!-- Detections -->
    <rect x="1002" y="170" width="158" height="110" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
    <text x="1081" y="212" font-size="16" font-weight="700" fill="#065f46">Detections</text>
    <text x="1081" y="236" font-size="12.5" fill="#059669">&amp; response</text>
  </g>

  <!-- flow arrows -->
  <g stroke="#334155" stroke-width="1.8">
    <line x1="190" y1="225" x2="216" y2="225" marker-end="url(#arr)"/>
    <line x1="394" y1="225" x2="412" y2="225" marker-end="url(#arr)"/>
    <line x1="590" y1="225" x2="608" y2="225" marker-end="url(#arr)"/>
    <line x1="786" y1="225" x2="804" y2="225" marker-end="url(#arr)"/>
    <line x1="982" y1="225" x2="1000" y2="225" marker-end="url(#arr)"/>
  </g>

  <!-- reference state feeding enrich -->
  <rect x="610" y="92" width="176" height="52" rx="9" fill="#ffffff" stroke="#4f46e5" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="698" y="114" font-size="12.5" font-weight="700" fill="#3730a3" text-anchor="middle">Reference state</text>
  <text x="698" y="132" font-size="11.5" fill="#4f46e5" text-anchor="middle">identity · assets · intel (moving data)</text>
  <line x1="698" y1="144" x2="698" y2="168" stroke="#4f46e5" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrR)"/>

  <!-- late events reopen windows loop on Correlate -->
  <path d="M894 280 C 894 316, 806 316, 806 288" fill="none" stroke="#b45309" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <text x="850" y="332" font-size="11.5" fill="#b45309" text-anchor="middle">late events reopen windows</text>

  <!-- reliability plane band -->
  <rect x="40" y="400" width="1120" height="150" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="64" y="432" font-size="17" font-weight="700" fill="#0f172a">Reliability plane</text>
  <text x="64" y="454" font-size="13" fill="#475569">The guarantees that decide whether a detection fires correctly, on time, and at all. This is the engineering, not the hygiene.</text>

  <g text-anchor="middle">
    <rect x="64" y="472" width="252" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="190" y="496" font-size="13" font-weight="600" fill="#334155">Delivery semantics</text>
    <text x="190" y="516" font-size="11.5" fill="#64748b">drop = missed detection;</text>
    <text x="190" y="530" font-size="11.5" fill="#64748b">dup = false-positive storm</text>

    <rect x="328" y="472" width="252" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="454" y="496" font-size="13" font-weight="600" fill="#334155">Event-time + watermarks</text>
    <text x="454" y="516" font-size="11.5" fill="#64748b">order by when it happened,</text>
    <text x="454" y="530" font-size="11.5" fill="#64748b">not when it arrived</text>

    <rect x="592" y="472" width="252" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="718" y="496" font-size="13" font-weight="600" fill="#334155">Backpressure headroom</text>
    <text x="718" y="516" font-size="11.5" fill="#64748b">the attack is the load spike;</text>
    <text x="718" y="530" font-size="11.5" fill="#64748b">capacity is a security control</text>

    <rect x="856" y="472" width="280" height="62" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="996" y="496" font-size="13" font-weight="600" fill="#334155">Checkpointed state + replay</text>
    <text x="996" y="516" font-size="11.5" fill="#64748b">correlation state survives</text>
    <text x="996" y="530" font-size="11.5" fill="#64748b">failure and recovers honestly</text>
  </g>

  <!-- caption -->
  <text x="40" y="582" font-size="13.5" fill="#64748b">Collect, normalize, enrich, correlate: one streaming system. The detections ride on top, and are only ever as good as the guarantees beneath them.</text>
</svg>
